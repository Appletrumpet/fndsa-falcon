name: Rust

on:
  push:
    paths: ["Rust/**", "Python/data/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["Rust/**", "Python/data/**", ".github/workflows/rust.yml"]

jobs:
  check:
    # Beide Zielplattformen aus PLAN.md, Abschnitt 10 (nur Korrektheit,
    # keine Zeitmessungen).
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust installieren
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: CI-Skript
        run: bash Rust/ci.sh
